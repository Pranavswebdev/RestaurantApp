services:
  - type: web
    name: foodrush-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromDatabase:
          name: foodrush-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
databases:
  - name: foodrush-db
    databaseName: foodrush
    region: oregon
